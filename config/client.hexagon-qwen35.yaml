## Hexagon NPU (HTP) variant, Qwen3.5-0.8B draft, proactive off.
## Requires a build with GGML_HEXAGON=ON (build/build_project_android_hexagon.sh).
client:
  result_path: "result/"
  exp_name: "mobile-qwen35"
  draft_model: models/Qwen3.5-0.8B-GGUF/Qwen3.5-0.8B-Q4_0.gguf
  n_gpu_layers: -1   # offload every layer to HTP0
  device: "HTP0"     # pin the NPU explicitly -- this build also has OpenCL
                     # compiled in, and main_gpu alone is an index into
                     # whichever order the two happen to register in, not
                     # reliably "the NPU". See GGML_HEXAGON_DEVICES env var
                     # to pick a different session than the default HTP0.
  main_gpu: 0
  single_gpu: true
  n_threads: 6
  n_threads_batch: 6
  flash_attn: true  # Hexagon's HMX FA kernel: ~3-7x prefill, ~3.5x decode-at-depth
  host: 202.122.49.242:17599
  dtype: fp16
  max_len: 2048
  max_n_beams: 4
  max_beam_len: 2
  max_branch_width: 4
  max_budget: 16
  max_seqs: 32       # explicit cap -- see header note; do not leave null (derives to 256)

  proactive:
    type: disabled   # required: the client refuses proactive drafting on a
                      # hybrid draft (Qwen3.5 recurrent state can't be rewound)
    max_n_beams: 4
    max_beam_len: 2
    max_branch_width: 4
    max_budget: 16

  max_new_tokens: 64
  client_idx: 0

  dataset: specbench
  reasoning: false
  max_request_num: -1
  req_offset: 0
  sample_req_cnt: 240
