client:
  draft_model: models/Qwen3-0.6B-GGUF/Qwen3-0.6B-f16.gguf
  n_gpu_layers: -1
  main_gpu: 0
  single_gpu: true   # true: whole draft model on main_gpu only; false: split layers across all visible GPUs
  n_threads: null
  n_threads_batch: null
  host: mango1:8000
  dtype: fp16
  max_len: 2048
  max_n_beams: 32
  max_beam_len: 4
  max_branch_width: 16
  max_budget: 64
  max_seqs: null
  max_new_tokens: 64
  client_idx: 0
  # Score the draft tree on the GPU: softmax + top-k become nodes in the
  # decode graph, and llama.cpp stops copying raw logits back to the host
  # (~19 MB per tree level at 32 beams). Requires a backend with soft_max
  # and top_k kernels. Off by default -- the llama.cpp backend sampling
  # API it uses is marked EXPERIMENTAL.
  backend_topk: false
  dataset: specbench
  reasoning: false
  max_request_num: -1
  req_offset: 0
  sample_req_cnt: 8
